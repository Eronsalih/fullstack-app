# LOCAL development / image build file.
#   docker compose up --build        -> run everything locally
#   docker compose build backend frontend && docker compose push backend frontend   (used by CI)
#
# Works with zero setup. Optionally copy .env.example to .env to change values.

name: fullstack-app

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-localpass123}
    ports:
      - "127.0.0.1:27018:27017" # only reachable from your own machine (e.g. MongoDB Compass)
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    build:
      context: ./backend
      labels:
        # Links the GHCR package to this GitHub repo (lets the workflow token pull it later)
        - org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY:-eronsalih/fullstack-app}
    image: ${IMAGE_PREFIX:-ghcr.io/eronsalih/fullstack-app}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-localpass123}
      MONGO_DB: ${MONGO_DB:-appdb}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000" # API docs: http://localhost:8000/api/docs
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      labels:
        - org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY:-eronsalih/fullstack-app}
    image: ${IMAGE_PREFIX:-ghcr.io/eronsalih/fullstack-app}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # App: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
