# nginx on the VM (host). Installed automatically by the pipeline (scripts/setup-vm.sh).
# Public port 80 -> frontend container, which is published only on 127.0.0.1:8080.
# Works with the bare IP address: no domain needed.

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
