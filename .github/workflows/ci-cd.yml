name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deployments at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Job 1: build both images with Docker Compose and push them to GHCR
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR requires lowercase names
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # docker-compose.yml reads these variables
          echo "IMAGE_PREFIX=${PREFIX}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images (docker compose build)
        run: docker compose build backend frontend

      - name: Push images tagged with the commit SHA (docker compose push)
        run: docker compose push backend frontend

      - name: Also tag and push "latest"
        run: |
          for service in backend frontend; do
            docker tag "${IMAGE_PREFIX}-${service}:${IMAGE_TAG}" "${IMAGE_PREFIX}-${service}:latest"
            docker push "${IMAGE_PREFIX}-${service}:latest"
          done

  # ---------------------------------------------------------------
  # Job 2: deploy the new images to the Azure VM over SSH
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      VM_HOST: ${{ secrets.AZURE_VM_HOST }}
      VM_USER: ${{ secrets.AZURE_VM_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host azure-vm
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy compose file and .env to the VM
        env:
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        run: |
          ssh azure-vm "mkdir -p ~/app"
          umask 077
          {
            echo "IMAGE_PREFIX=${IMAGE_PREFIX}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "MONGO_USER=${MONGO_USER}"
            echo "MONGO_PASSWORD=${MONGO_PASSWORD}"
            echo "MONGO_DB=appdb"
          } > .env.prod
          scp docker-compose.prod.yml azure-vm:~/app/docker-compose.yml
          scp .env.prod azure-vm:~/app/.env

      - name: Pull new images and restart containers
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh azure-vm "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh azure-vm "cd ~/app && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Smoke test
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "http://${VM_HOST}/api/health"; then
              echo
              echo "Deployment OK: http://${VM_HOST}"
              exit 0
            fi
            echo "Waiting for the app... (${i}/24)"
            sleep 5
          done
          echo "Smoke test failed. Container status and logs:"
          ssh azure-vm "cd ~/app && docker compose ps && docker compose logs --tail=60"
          exit 1
