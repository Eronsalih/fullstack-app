server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's internal DNS. Using a variable below means nginx starts even if
    # the backend container is not up yet, and re-resolves the name later.
    resolver 127.0.0.11 valid=10s;

    # API requests -> FastAPI container (the /api prefix is kept as is)
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed build assets for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
